name: magic_payments
description: Multi-rail billing for the Magic Framework. One entitlement contract over Stripe on the web and store in-app purchase on mobile.
version: 0.0.1
homepage: https://magic.fluttersdk.com/payments
documentation: https://magic.fluttersdk.com/packages/payments/getting-started/installation
repository: https://github.com/fluttersdk/magic_payments
issue_tracker: https://github.com/fluttersdk/magic_payments/issues

topics:
  - payments
  - billing
  - in-app-purchase
  - magic-framework
  - flutter-plugin

# Inherited from `magic`, not chosen here: magic 0.0.6 declares
# `sdk: ">=3.11.0 <4.0.0"` and `flutter: ">=3.41.0"`, and a package cannot
# resolve below its own dependency's floor. Copying the older block from a
# sibling plugin would produce a pubspec that claims support it does not have.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  magic: ^0.0.6
  # ^0.0.13 rather than the ^0.0.8 a sibling still declares, and the difference
  # is a floor rather than a conflict. Dart's caret is not npm's: `pub_semver`
  # bumps the MINOR when major is 0, so `^0.0.8` means `>=0.0.8 <0.1.0` and
  # resolves 0.0.13 alongside this line rather than pinning 0.0.8 against it.
  # Measured on a scratch package reproducing the published graph, which
  # resolved on the first try. What this line buys is the guarantee that a
  # solver cannot hand this package an older CLI, not the resolution of a
  # clash.
  fluttersdk_artisan: ^0.0.13
  # The STORE rail's SDK, and the only third-party billing dependency here. Its
  # own floors (`sdk >=3.4.0`, `flutter >=3.22.0`) sit BELOW this package's, so
  # adding it cannot drag the environment block down; the block above stays
  # magic's.
  purchases_flutter: ^10.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0
